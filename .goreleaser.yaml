version: 2

project_name: tui-postman

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tui-postman
    main: ./main.go
    binary: tui-postman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: tui-postman
    repository:
      owner: your-github-username
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/your-github-username/tui-postman"
    description: "Production Terminal HTTP Client built with Bubble Tea"
    license: "MIT"
    install: |
      bin.install "tui-postman"
    test: |
      system "#{bin}/tui-postman --version"