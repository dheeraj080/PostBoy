version: 2

project_name: postboy

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: postboy
    main: ./cmd/postboy
    binary: postboy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: postboy
    repository:
      owner: dheeraj080
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Skip publishing the formula when no tap token is configured.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: "https://github.com/dheeraj080/PostBoy"
    description: "Terminal HTTP/API client built with Bubble Tea"
    license: "MIT"
    install: |
      bin.install "postboy"
    test: |
      system "#{bin}/postboy", "--version"
